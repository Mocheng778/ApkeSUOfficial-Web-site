<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ApkeSU 下载</title>
<style>
body {
    text-align: center;
    padding: 60px 20px;
    font-size: 18px;
    background: var(--bg, #f8fafc);
    font-family: system-ui, -apple-system, sans-serif;
    transition: background 0.3s ease;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

/* ── 导航栏 ── */
.nav-bar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 5vw;
    height: 56px;
    background: var(--bg-card, #ffffff);
    border-bottom: 1px solid var(--border, #e2e8f0);
    z-index: 99;
    transition: background 0.3s ease, border-color 0.3s ease;
}

.logo {
    font-size: 20px;
    font-weight: 800;
    color: var(--primary, #6366f1);
    text-decoration: none;
}

.nav-controls {
    display: flex;
    gap: 8px;
    align-items: center;
}

.theme-toggle {
    background: none;
    border: 1.5px solid var(--border, #e2e8f0);
    border-radius: 50px;
    padding: 5px 12px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 12px;
    color: var(--text-muted, #64748b);
    transition: all 0.2s ease;
}

.theme-toggle:hover {
    border-color: var(--primary, #6366f1);
    color: var(--primary, #6366f1);
}

.theme-toggle .icon {
    font-size: 13px;
}

.lang-select {
    background: var(--bg-card, #ffffff);
    border: 1.5px solid var(--border, #e2e8f0);
    border-radius: 8px;
    padding: 4px 10px;
    font-size: 12px;
    color: var(--text, #1e293b);
    cursor: pointer;
    transition: all 0.2s ease;
}

.lang-select:hover {
    border-color: var(--primary, #6366f1);
}

.lang-select option {
    background: var(--bg-card, #ffffff);
    color: var(--text, #1e293b);
}

/* ── 下载卡片 ── */
.box {
    max-width: 480px;
    margin: 0 auto;
    background: var(--bg-card, #ffffff);
    padding: 40px 32px;
    border-radius: 20px;
    box-shadow: var(--shadow, 0 4px 24px rgba(0,0,0,0.08));
    border: 1px solid var(--border, #e2e8f0);
    transition: all 0.3s ease;
    position: relative;
    overflow: hidden;
}

.box::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 4px;
    background: linear-gradient(90deg, var(--primary, #6366f1), var(--accent, #8b5cf6));
}

.version-tag {
    display: inline-block;
    background: rgba(99,102,241,0.1);
    color: var(--primary, #6366f1);
    font-size: 11px;
    font-weight: 600;
    padding: 4px 12px;
    border-radius: 99px;
    margin-bottom: 16px;
    letter-spacing: 0.5px;
    border: 1px solid rgba(99,102,241,0.2);
}

h2 {
    color: var(--text, #1e293b);
    margin-bottom: 8px;
    font-size: 22px;
    font-weight: 700;
    transition: color 0.3s ease;
}

.subtitle {
    color: var(--text-muted, #64748b);
    font-size: 14px;
    margin-bottom: 28px;
    transition: color 0.3s ease;
}

/* ── 下载按钮组 ── */
.btn-group {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-top: 20px;
}

.down-btn {
    padding: 14px 24px;
    background: var(--primary, #6366f1);
    color: #fff;
    border-radius: 12px;
    text-decoration: none;
    font-weight: 600;
    font-size: 14px;
    transition: all 0.2s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    border: none;
    cursor: pointer;
}

.down-btn:hover {
    background: var(--primary-dark, #4f46e5);
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(99,102,241,0.3);
}

.down-btn.secondary {
    background: var(--bg, #f8fafc);
    color: var(--text, #1e293b);
    border: 1.5px solid var(--border, #e2e8f0);
}

.down-btn.secondary:hover {
    background: var(--primary-light, #e0e7ff);
    border-color: var(--primary, #6366f1);
    color: var(--primary, #6366f1);
    transform: translateY(-1px);
    box-shadow: none;
}

.down-btn .icon {
    font-size: 16px;
}

/* ── 倒计时提示 ── */
.count-text {
    margin-top: 20px;
    font-size: 13px;
    color: var(--text-muted, #64748b);
    transition: color 0.3s ease;
}

.count-text .timer {
    color: var(--primary, #6366f1);
    font-weight: 700;
    font-size: 18px;
}

/* ── 说明文字 ── */
.tip {
    color: var(--text-muted, #64748b);
    margin-bottom: 24px;
    line-height: 1.7;
    font-size: 13px;
    padding: 12px 16px;
    background: rgba(99,102,241,0.06);
    border-radius: 10px;
    border-left: 3px solid var(--primary, #6366f1);
    text-align: left;
}

/* ── 版本信息 ── */
.version-info {
    margin-top: 24px;
    padding: 16px;
    background: var(--bg, #f8fafc);
    border-radius: 10px;
    border: 1px solid var(--border, #e2e8f0);
    font-size: 12px;
    color: var(--text-muted, #64748b);
    line-height: 1.8;
    transition: all 0.3s ease;
}

.version-info strong {
    color: var(--text, #1e293b);
}

/* ── 暗色主题变量与覆盖 ── */
[data-theme="dark"] {
    --bg: #0f172a;
    --bg-card: #1e293b;
    --border: #334155;
    --text: #f1f5f9;
    --text-muted: #94a3b8;
}
[data-theme="dark"] body {
    background: var(--bg);
}

[data-theme="dark"] .box {
    background: var(--bg-card);
    border-color: var(--border);
    box-shadow: 0 4px 24px rgba(0,0,0,0.4);
}

[data-theme="dark"] .nav-bar {
    background: var(--bg-card);
    border-color: var(--border);
}

[data-theme="dark"] .lang-select,
[data-theme="dark"] .theme-toggle {
    background: var(--bg-card);
    border-color: var(--border);
    color: var(--text-muted);
}

[data-theme="dark"] .down-btn.secondary {
    background: var(--bg-card);
    color: var(--text);
    border-color: var(--border);
}

[data-theme="dark"] .down-btn.secondary:hover {
    background: #312e81;
    border-color: #818cf8;
    color: #c7d2fe;
}

[data-theme="dark"] .version-info {
    background: var(--bg-card);
    border-color: var(--border);
    color: var(--text-muted);
}

[data-theme="dark"] .tip {
    background: rgba(99,102,241,0.15);
    color: #cbd5e1;
}

/* ── Toast 淡入动画 */
.toast {
    position: fixed;
    top: 24px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--text, #1e293b);
    color: var(--bg, #f8fafc);
    padding: 10px 24px;
    border-radius: 50px;
    font-size: 13px;
    font-weight: 500;
    z-index: 9999;
    box-shadow: 0 4px 16px rgba(0,0,0,0.2);

    opacity: 0;
    pointer-events: none;
    transition: opacity 0.22s ease;
}
.toast.show {
    opacity: 1;
    pointer-events: auto;
}

/* ── 响应式移动端适配 ── */
@media (max-width: 480px) {
    .box {
        padding: 32px 24px;
        margin: 0 12px;
    }
    h2 {
        font-size: 20px;
    }
    .nav-bar {
        padding: 0 4vw;
    }
}
</style>
</head>
<body>

<div class="toast" id="toast"></div>

<!-- ── 导航栏 ── -->
<nav class="nav-bar">
    <a href="index.html" class="logo">ApkeSU</a>
    <div class="nav-controls">
        <select class="lang-select" id="langSelect" onchange="switchLang(this.value)">
            <option value="zh">中文</option>
            <option value="en">English</option>
            <option value="ja">日本語</option>
            <option value="ko">한국어</option>
        </select>
        <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">
            <span class="icon" id="themeIcon">🌙</span>
            <span id="themeText" data-i18n="theme-dark">暗黑</span>
        </button>
    </div>
</nav>

<!-- ── 下载卡片 ── -->
<div class="box">
    <span class="version-tag">LATEST RELEASE</span>
    <h2>ApkeSU V2.7.1 (32720)</h2>
    <p class="subtitle" data-i18n="subtitle">稳定版 · 一键 Root 管理工具</p>

    <div class="btn-group">
        <a href="https://github.com/fixz232/ApkeSU/releases/download/2.7.1/ApkeSU_2.7.1_32720-release.apk" 
           class="down-btn" 
           target="_blank"
           onclick="showDownloadTip(event, '正在跳转 Github 源下载')">
            <span class="icon">⬇</span>
            <span data-i18n="btn-github">GITHUB</span>
        </a>
        <a href="https://ghm.078465.xyz/https://github.com/fixz232/ApkeSU/releases/download/2.7.1/ApkeSU_2.7.1_32720-release.apk" 
           class="down-btn secondary"
           target="_blank"
           onclick="showDownloadTip(event, '正在打开加速镜像下载')">
            <span class="icon">⚡</span>
            <span data-i18n="btn-accel">加速GITHUB下载</span>
        </a>
        <a href="https://github.com/fixz232/ApkeSU/releases/tag/2.7.1" 
           class="down-btn secondary"
           target="_blank"
           onclick="showDownloadTip(event, '前往发行页面')">
            <span class="icon">📦</span>
            <span data-i18n="btn-release">发行页面</span>
        </a>
        <a href="https://pan.quark.cn/s/6fbc1430cee8" 
           class="down-btn secondary"
           target="_blank"
           onclick="showDownloadTip(event, '打开夸克网盘页面')">
            <span class="icon">☁️</span>
            <span data-i18n="btn-quark">夸克网盘</span>
        </a>
    </div>

    <div class="version-info">
        <strong data-i18n="version-title">版本信息</strong><br>
        <span data-i18n="version-detail">内核模式：Tracepoint LKM｜完整兼容 SELinux 放行｜内置 KPatch Next</span>
    </div>
</div>

<script>
// ── 多语言字典 ──
const i18n = {
    zh: {
        'subtitle': '稳定版 · 一键 Root 管理工具',
        'btn-github': 'GITHUB',
        'btn-accel': '加速GITHUB下载',
        'btn-release': '发行页面',
        'btn-quark': '夸克网盘',
        'version-title': '版本信息',
        'version-detail': '内核模式：Tracepoint LKM｜完整兼容 SELinux 放行｜内置 KPatch Next',
        'theme-dark': '暗黑',
        'theme-light': '亮色'
    },
    en: {
        'subtitle': 'Stable Release · One-Click Root Manager',
        'btn-github': 'GITHUB',
        'btn-accel': 'Fast GITHUB Download',
        'btn-release': 'Release Page',
        'btn-quark': 'Quark Cloud',
        'version-title': 'Version Info',
        'version-detail': 'Kernel Mode: Tracepoint LKM | SELinux Compatible | KPatch Next Built-in',
        'theme-dark': 'Dark',
        'theme-light': 'Light'
    },
    ja: {
        'subtitle': '安定版 · ワンクリックRoot管理ツール',
        'btn-github': 'GITHUB',
        'btn-accel': '高速GITHUBダウンロード',
        'btn-release': 'リリースページ',
        'btn-quark': 'Quarkクラウド',
        'version-title': 'バージョン情報',
        'version-detail': 'カーネルモード: Tracepoint LKM | SELinux互換 | KPatch Next内蔵',
        'theme-dark': 'ダーク',
        'theme-light': 'ライト'
    },
    ko: {
        'subtitle': '안정 버전 · 원클릭 Root 관리 도구',
        'btn-github': 'GITHUB',
        'btn-accel': '고속 GITHUB 다운로드',
        'btn-release': '릴리스 페이지',
        'btn-quark': 'Quark 클라우드',
        'version-title': '버전 정보',
        'version-detail': '커널 모드: Tracepoint LKM | SELinux 호환 | KPatch Next 내장',
        'theme-dark': '어둡게',
        'theme-light': '밝게'
    }
};

let currentLang = 'zh';
let toastTimer = null;

// Toast 下载提示
function showDownloadTip(evt, msg) {
    const toast = document.getElementById('toast');
    toast.innerText = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => {
        toast.classList.remove('show');
    }, 2200);
}

function switchLang(lang) {
    currentLang = lang;
    document.documentElement.lang = lang === 'zh' ? 'zh-CN' : lang;
    const dict = i18n[lang] || i18n['zh'];
    document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (dict[key]) {
            el.innerHTML = dict[key];
        }
    });
    localStorage.setItem('apkesu_lang', lang);
}

// ── 主题切换
function toggleTheme() {
    const html = document.documentElement;
    const isDark = html.getAttribute('data-theme') === 'dark';
    const nextDark = !isDark;

    if(nextDark){
        html.setAttribute('data-theme', 'dark');
        document.getElementById('themeIcon').textContent = '☀️';
        document.querySelector('[data-i18n="theme-dark"]').innerText = i18n[currentLang]['theme-light'];
    }else{
        html.removeAttribute('data-theme');
        document.getElementById('themeIcon').textContent = '🌙';
        document.querySelector('[data-i18n="theme-dark"]').innerText = i18n[currentLang]['theme-dark'];
    }
    localStorage.setItem('apkesu_theme', nextDark ? 'dark' : 'light');
}

// ── 初始化 ──
(function init() {
    const savedTheme = localStorage.getItem('apkesu_theme');
    const savedLang = localStorage.getItem('apkesu_lang');

    // 主题初始化
    if (savedTheme === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
        document.getElementById('themeIcon').textContent = '☀️';
    } else {
        document.getElementById('themeIcon').textContent = '🌙';
    }

    // 语言初始化
    if (savedLang && i18n[savedLang]) {
        document.getElementById('langSelect').value = savedLang;
        switchLang(savedLang);
    }else{
        switchLang('zh');
    }
})();
</script>
</body>
</html>
